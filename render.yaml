# Render Blueprint for Unified Full-Stack Deployment
# Deploys both React Frontend and FastAPI Backend as a single free Web Service
services:
  - type: web
    name: engineering-materials-classifier
    env: python
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
